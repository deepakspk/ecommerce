<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1680" height="360" fill="url(#bg)"/>

  <!-- decorative dots & circles -->
  <circle cx="120" cy="70" r="130" fill="#3b82f6" opacity="0.35"/>
  <circle cx="1600" cy="330" r="170" fill="#1d4ed8" opacity="0.5"/>
  <g fill="#93c5fd" opacity="0.7">
    <circle cx="470" cy="60" r="4"/><circle cx="530" cy="110" r="3"/><circle cx="410" cy="140" r="3"/>
    <circle cx="1210" cy="50" r="4"/><circle cx="700" cy="40" r="3"/><circle cx="960" cy="70" r="3"/>
  </g>

  <!-- book stack illustration (right, inside safe zone) -->
  <g transform="translate(1130 70)">
    <rect x="0" y="150" width="260" height="34" rx="8" fill="#f59e0b"/>
    <rect x="18" y="112" width="224" height="34" rx="8" fill="#f43f5e"/>
    <rect x="8" y="74" width="240" height="34" rx="8" fill="#22c55e"/>
    <rect x="30" y="36" width="200" height="34" rx="8" fill="#e0e7ff"/>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="30" y1="167" x2="230" y2="167"/>
      <line x1="46" y1="129" x2="214" y2="129"/>
      <line x1="36" y1="91" x2="220" y2="91"/>
    </g>
    <path d="M130 10l9 20 22 3-16 15 4 22-19-10-19 10 4-22-16-15 22-3z" fill="#fbbf24"/>
  </g>

  <!-- headline (safe zone starts ~x=210) -->
  <text x="260" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">Discover Your Next Great Read</text>
  <text x="260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#bfdbfe">Thousands of titles, from timeless classics to new arrivals — delivered across Nepal.</text>

  <!-- CTA -->
  <g>
    <rect x="260" y="240" width="200" height="56" rx="28" fill="#ffffff"/>
    <text x="360" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1d4ed8">SHOP NOW</text>
  </g>
</svg>
