<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 360">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1680" height="360" fill="url(#bg4)"/>

  <circle cx="110" cy="300" r="140" fill="#7c3aed" opacity="0.5"/>
  <circle cx="1600" cy="50" r="150" fill="#6d28d9" opacity="0.6"/>
  <g fill="#e9d5ff" opacity="0.8">
    <circle cx="500" cy="60" r="4"/><circle cx="760" cy="40" r="3"/><circle cx="1000" cy="70" r="4"/>
    <circle cx="430" cy="300" r="3"/><circle cx="1250" cy="310" r="4"/>
  </g>
  <!-- sparkles -->
  <g fill="#fde68a">
    <path d="M620 90l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="M1080 280l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>

  <!-- leaning books with NEW tag (right) -->
  <g transform="translate(1150 70)">
    <rect x="0" y="30" width="44" height="190" rx="6" fill="#f472b6"/>
    <rect x="52" y="18" width="44" height="202" rx="6" fill="#fbbf24"/>
    <rect x="104" y="38" width="44" height="182" rx="6" fill="#34d399"/>
    <g transform="rotate(12 196 130)">
      <rect x="174" y="30" width="44" height="200" rx="6" fill="#e0e7ff"/>
    </g>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <line x1="10" y1="60" x2="34" y2="60"/>
      <line x1="62" y1="48" x2="86" y2="48"/>
      <line x1="114" y1="68" x2="138" y2="68"/>
    </g>
    <g transform="rotate(-10 60 -6)">
