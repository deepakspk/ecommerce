    </g>
  </g>

  <text x="260" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#ffffff">New Arrivals Every Week</text>
  <text x="260" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#e9d5ff">Fresh titles land on our shelves every week — be the first to read them.</text>

  <g>
