<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 360">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#881337"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="1680" height="360" fill="url(#bg5)"/>

  <circle cx="100" cy="60" r="130" fill="#9f1239" opacity="0.6"/>
  <circle cx="1610" cy="320" r="150" fill="#be123c" opacity="0.5"/>
  <g fill="#fecdd3" opacity="0.75">
    <circle cx="520" cy="50" r="4"/><circle cx="820" cy="35" r="3"/><circle cx="1120" cy="60" r="4"/>
    <circle cx="460" cy="310" r="3"/><circle cx="990" cy="315" r="4"/>
  </g>

  <!-- delivery van with books (right) -->
  <g transform="translate(1120 120)">
    <!-- motion lines -->
    <g stroke="#fecdd3" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <line x1="-60" y1="70" x2="-10" y2="70"/>
      <line x1="-80" y1="100" x2="-24" y2="100"/>
      <line x1="-56" y1="130" x2="-16" y2="130"/>
    </g>
    <!-- body -->
    <rect x="10" y="40" width="200" height="110" rx="12" fill="#fff1f2"/>
    <path d="M210 70h52a10 10 0 0 1 8 4l26 34a12 12 0 0 1 3 8v22a12 12 0 0 1-12 12h-77z" fill="#ffe4e6"/>
    <rect x="222" y="82" width="42" height="30" rx="6" fill="#9f1239"/>
    <!-- books painted on the van -->
    <g transform="translate(32 62)">
      <rect x="0" y="14" width="26" height="52" rx="4" fill="#f59e0b"/>
      <rect x="30" y="6" width="26" height="60" rx="4" fill="#2563eb"/>
      <rect x="60" y="18" width="26" height="48" rx="4" fill="#16a34a"/>
      <text x="100" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#be123c">BOOKS</text>
    </g>
    <!-- wheels -->
    <circle cx="70" cy="156" r="24" fill="#1f2937"/>
    <circle cx="70" cy="156" r="10" fill="#e5e7eb"/>
    <circle cx="230" cy="156" r="24" fill="#1f2937"/>
    <circle cx="230" cy="156" r="10" fill="#e5e7eb"/>
  </g>

  <text x="260" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#ffffff">Books to Your Doorstep</text>
  <text x="260" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#fecdd3">Cash on Delivery · Live order tracking · Delivery all across Nepal</text>

  <g>
    <rect x="260" y="230" width="220" height="56" rx="28" fill="#facc15"/>
    <text x="370" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#78350f">ORDER TODAY</text>
  </g>
</svg>
